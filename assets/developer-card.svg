
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="660" viewBox="0 0 520 660">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#070d18"/>
      <stop offset="1" stop-color="#02060d"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .mono { font-family:'JetBrains Mono','Fira Code',Consolas,monospace; }
    .title { fill:#f8fafc; font-size:24px; font-weight:700; }
    .role { fill:#22d3ee; font-size:14px; font-weight:700; letter-spacing:2px; }
    .text { fill:#cbd5e1; font-size:14px; }
    .small { fill:#7c8aa5; font-size:12px; }
    .label { fill:#e2e8f0; font-size:13px; font-weight:700; }
    .percent { fill:#22d3ee; font-size:12px; font-weight:700; }
    .chip { fill:#e2e8f0; font-size:12px; font-weight:700; }
    .cursor { fill:#22d3ee; animation:blink 1s steps(1) infinite; }
    .pulse { animation:pulse 3.5s ease-in-out infinite; transform-origin:260px 130px; }
    .float1 { animation:float 5s ease-in-out infinite; }
    .float2 { animation:float 6s ease-in-out infinite reverse; }
    .barFill { transform-origin:left center; animation:grow 2.4s cubic-bezier(.22,.61,.36,1) forwards; }
    .b1 { animation-delay:.4s; }
    .b2 { animation-delay:.8s; }
    .b3 { animation-delay:1.2s; }
    .b4 { animation-delay:1.6s; }
    .line1 { clip-path:inset(0 100% 0 0); animation:type1 2s steps(24) .3s forwards; }
    .line2 { clip-path:inset(0 100% 0 0); animation:type2 2s steps(26) 2.6s forwards; }

    @keyframes blink { 50% { opacity:0; } }
    @keyframes pulse {
      0%,100% { transform:scale(1); opacity:.8; }
      50% { transform:scale(1.08); opacity:1; }
    }
    @keyframes float {
      0%,100% { transform:translateY(0); }
      50% { transform:translateY(-7px); }
    }
    @keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
    @keyframes type1 { to { clip-path:inset(0 0 0 0); } }
    @keyframes type2 { to { clip-path:inset(0 0 0 0); } }
  </style>

  <!-- Card -->
  <rect width="520" height="660" rx="24" fill="url(#cardBg)"/>
  <rect x="1" y="1" width="518" height="658" rx="23" fill="none" stroke="#22d3ee" stroke-opacity=".28"/>
  <rect x="1" y="1" width="518" height="658" rx="23" fill="none" stroke="#a78bfa" stroke-opacity=".12"/>

  <!-- Animated developer core -->
  <g>
    <circle cx="260" cy="130" r="105" fill="url(#coreGlow)" class="pulse"/>

    <circle cx="260" cy="130" r="82" fill="none" stroke="#22d3ee"
            stroke-width="2" stroke-dasharray="10 14" opacity=".8">
      <animateTransform attributeName="transform" type="rotate"
        from="0 260 130" to="360 260 130" dur="12s" repeatCount="indefinite"/>
    </circle>

    <circle cx="260" cy="130" r="66" fill="none" stroke="#a78bfa"
            stroke-width="2" stroke-dasharray="4 10" opacity=".6">
      <animateTransform attributeName="transform" type="rotate"
        from="360 260 130" to="0 260 130" dur="9s" repeatCount="indefinite"/>
    </circle>

    <circle cx="260" cy="130" r="48" fill="#0f172a" stroke="url(#cyan)" stroke-width="3"/>

    <text x="260" y="124" text-anchor="middle" class="mono" font-size="20" fill="#22d3ee">&lt;/&gt;</text>
    <text x="260" y="148" text-anchor="middle" class="mono" font-size="11" fill="#8fa3bf">BUILD</text>

    <g>
      <circle cx="342" cy="130" r="5" fill="#22d3ee">
        <animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <animateTransform attributeName="transform" type="rotate"
        from="0 260 130" to="360 260 130" dur="7s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Identity -->
  <text x="260" y="272" text-anchor="middle" class="mono title">Muhammad Ali</text>
  <text x="260" y="298" text-anchor="middle" class="mono role">SOFTWARE ENGINEER</text>

  <!-- Typing status -->
  <rect x="45" y="325" width="430" height="54" rx="14" fill="#02060d" stroke="#1e293b"/>
  <text x="65" y="348" class="mono small">$ status --now</text>
  <text x="65" y="368" class="mono text clip1 line1">Building mobile &amp; backend products</text>
  <rect x="330" y="356" width="9" height="15" class="cursor"/>

  <rect x="45" y="391" width="430" height="38" rx="12" fill="#02060d" stroke="#1e293b"/>
  <text x="65" y="415" class="mono text clip2 line2">Flutter • Kotlin • ASP.NET Core</text>

  <!-- Skills -->
  <text x="45" y="468" class="mono label">Mobile Development</text>
  <text x="475" y="468" text-anchor="end" class="mono percent">92%</text>
  <rect x="45" y="478" width="430" height="8" rx="4" fill="#111c2e"/>
  <rect x="45" y="478" width="396" height="8" rx="4" fill="url(#cyan)" class="barFill b1"/>

  <text x="45" y="516" class="mono label">Backend &amp; APIs</text>
  <text x="475" y="516" text-anchor="end" class="mono percent">88%</text>
  <rect x="45" y="526" width="430" height="8" rx="4" fill="#111c2e"/>
  <rect x="45" y="526" width="378" height="8" rx="4" fill="url(#purple)" class="barFill b2"/>

  <text x="45" y="564" class="mono label">Databases</text>
  <text x="475" y="564" text-anchor="end" class="mono percent">84%</text>
  <rect x="45" y="574" width="430" height="8" rx="4" fill="#111c2e"/>
  <rect x="45" y="574" width="361" height="8" rx="4" fill="url(#cyan)" class="barFill b3"/>

  <text x="45" y="612" class="mono label">Problem Solving</text>
  <text x="475" y="612" text-anchor="end" class="mono percent">95%</text>
  <rect x="45" y="622" width="430" height="8" rx="4" fill="#111c2e"/>
  <rect x="45" y="622" width="409" height="8" rx="4" fill="url(#purple)" class="barFill b4"/>

  <!-- Floating tech chips -->
  <g class="float1">
    <rect x="45" y="645" width="90" height="0" fill="none"/>
  </g>
</svg>
