<svg xmlns="http://www.w3.org/2000/svg" width="520" height="820" viewBox="0 0 520 820">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#070d18"/>
      <stop offset="1" stop-color="#02060d"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="520" height="660" rx="24" fill="url(#cardBg)"/>
  <rect x="1" y="1" width="518" height="658" rx="23" fill="none" stroke="#22d3ee" stroke-opacity="0.28"/>
  <rect x="1" y="1" width="518" height="658" rx="23" fill="none" stroke="#a78bfa" stroke-opacity="0.12"/>

  <!-- Animated developer core -->
  <circle cx="260" cy="130" r="105" fill="url(#coreGlow)">
    <animate attributeName="r" values="100;112;100" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="260" cy="130" r="82" fill="none" stroke="#22d3ee" stroke-width="2"
          stroke-dasharray="10 14" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate"
      from="0 260 130" to="360 260 130" dur="12s" repeatCount="indefinite"/>
  </circle>

  <circle cx="260" cy="130" r="66" fill="none" stroke="#a78bfa" stroke-width="2"
          stroke-dasharray="4 10" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate"
      from="360 260 130" to="0 260 130" dur="9s" repeatCount="indefinite"/>
  </circle>

  <circle cx="260" cy="130" r="48" fill="#0f172a" stroke="url(#cyan)" stroke-width="3"/>

  <text x="260" y="126" text-anchor="middle"
        font-family="JetBrains Mono, Fira Code, Consolas, monospace"
        font-size="20" fill="#22d3ee">&lt;/&gt;</text>
  <text x="260" y="150" text-anchor="middle"
        font-family="JetBrains Mono, Fira Code, Consolas, monospace"
        font-size="11" fill="#8fa3bf">BUILD</text>

  <g>
    <circle cx="342" cy="130" r="5" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="rotate"
      from="0 260 130" to="360 260 130" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- Identity -->
  <text x="260" y="272" text-anchor="middle"
        font-family="JetBrains Mono, Fira Code, Consolas, monospace"
        font-size="24" font-weight="700" fill="#f8fafc">Muhammad Ali</text>
  <text x="260" y="298" text-anchor="middle"
        font-family="JetBrains Mono, Fira Code, Consolas, monospace"
        font-size="14" font-weight="700" letter-spacing="2" fill="#22d3ee">SOFTWARE ENGINEER</text>

  <!-- Typing status -->
  <rect x="45" y="325" width="430" height="54" rx="14" fill="#02060d" stroke="#1e293b"/>
  <text x="65" y="348" font-family="JetBrains Mono, Consolas, monospace"
        font-size="12" fill="#7c8aa5">$ status --now</text>

  <text x="65" y="368" font-family="JetBrains Mono, Consolas, monospace"
        font-size="14" fill="#cbd5e1">Building mobile &amp; backend products</text>

  <rect x="345" y="356" width="9" height="15" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <rect x="45" y="391" width="430" height="38" rx="12" fill="#02060d" stroke="#1e293b"/>
  <text x="65" y="415" font-family="JetBrains Mono, Consolas, monospace"
        font-size="14" fill="#cbd5e1">Flutter • Kotlin • ASP.NET Core</text>

  <!-- Skills -->
  <text x="45" y="468" font-family="JetBrains Mono, Consolas, monospace"
        font-size="13" font-weight="700" fill="#e2e8f0">Mobile Development</text>
  <text x="475" y="468" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace"
        font-size="12" font-weight="700" fill="#22d3ee">92%</text>
  <rect x="45" y="478" width="430" height="8" rx="4" fill="#111c2e"/>
  <rect x="45" y="478" width="396" height="8" rx="4" fill="url(#cyan)">
    <animate attributeName="width" values="0;396" dur="2.4s" begin="0.4s" fill="freeze"/>
  </rect>

  <text x="45" y="516" font-family="JetBrains Mono, Consolas, monospace"
        font-size="13" font-weight="700" fill="#e2e8f0">Backend &amp; APIs</text>
  <text x="475" y="516" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace"
        font-size="12" font-weight="700" fill="#22d3ee">88%</text>
  <rect x="45" y="526" width="430" height="8" rx="4" fill="#111c2e"/>
  <rect x="45" y="526" width="0" height="8" rx="4" fill="url(#purple)">
    <animate attributeName="width" values="0;378" dur="2.4s" begin="0.8s" fill="freeze"/>
  </rect>

  <text x="45" y="564" font-family="JetBrains Mono, Consolas, monospace"
        font-size="13" font-weight="700" fill="#e2e8f0">Databases</text>
  <text x="475" y="564" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace"
        font-size="12" font-weight="700" fill="#22d3ee">84%</text>
  <rect x="45" y="574" width="430" height="8" rx="4" fill="#111c2e"/>
  <rect x="45" y="574" width="0" height="8" rx="4" fill="url(#cyan)">
    <animate attributeName="width" values="0;361" dur="2.4s" begin="1.2s" fill="freeze"/>
  </rect>

  <text x="45" y="612" font-family="JetBrains Mono, Consolas, monospace"
        font-size="13" font-weight="700" fill="#e2e8f0">Problem Solving</text>
  <text x="475" y="612" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace"
        font-size="12" font-weight="700" fill="#22d3ee">95%</text>
  <rect x="45" y="622" width="430" height="8" rx="4" fill="#111c2e"/>
  <rect x="45" y="622" width="0" height="8" rx="4" fill="url(#purple)">
    <animate attributeName="width" values="0;409" dur="2.4s" begin="1.6s" fill="freeze"/>
  </rect>
</svg>
