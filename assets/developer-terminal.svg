<svg xmlns="http://www.w3.org/2000/svg" width="520" height="660" viewBox="0 0 520 660">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#070d18"/>
      <stop offset="1" stop-color="#02060d"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,monospace; }
    .title { fill:#f8fafc; font-size:24px; font-weight:700; }
    .role { fill:#22d3ee; font-size:14px; font-weight:600; letter-spacing:1.5px; }
    .text { fill:#cbd5e1; font-size:14px; }
    .small { fill:#7c8aa5; font-size:12px; }
    .label { fill:#e2e8f0; font-size:13px; font-weight:600; }
    .percent { fill:#22d3ee; font-size:12px; font-weight:700; }
    .chipText { fill:#e2e8f0; font-size:12px; font-weight:600; }
    .cursor { fill:#22d3ee; animation:blink 1s steps(1) infinite; }
    .pulse { animation:pulse 3s ease-in-out infinite; transform-origin:260px 150px; }
    .float { animation:float 5s ease-in-out infinite; }
    .barFill { transform-origin:left center; animation:grow 2.4s cubic-bezier(.22,.61,.36,1) forwards; }
    .b1 { animation-delay:.5s; }
    .b2 { animation-delay:.9s; }
    .b3 { animation-delay:1.3s; }
    .b4 { animation-delay:1.7s; }
    .line1 { animation:type1 2s steps(24) .3s forwards; }
    .line2 { animation:type2 2s steps(26) 2.4s forwards; }
    .clip1 { clip-path:inset(0 100% 0 0); }
    .clip2 { clip-path:inset(0 100% 0 0); }

    @keyframes blink { 50% { opacity:0; } }
    @keyframes pulse {
      0%,100% { transform:scale(1); opacity:.85; }
      50% { transform:scale(1.08); opacity:1; }
    }
    @keyframes float {
      0%,100% { transform:translateY(0); }
      50% { transform:translateY(-7px); }
    }
    @keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
    @keyframes type1 { to { clip-path:inset(0 0 0 0); } }
    @keyframes type2 { to { clip-path:inset(0 0 0 0); } }
  </style>

  <!-- Card -->
  <rect width="520" height="660" rx="24" fill="url(#cardBg)"/>
  <rect x="1" y="1" width="518" height="658" rx="23" fill="none" stroke="#22d3ee" stroke-opacity=".28"/>
  <rect x="1" y="1" width="518" height="658" rx="23" fill="none" stroke="#a78bfa" stroke-opacity=".12"/>

  <!-- Avatar -->
  <circle cx="260" cy="150" r="105" fill="url(#avatarGlow)" class="pulse"/>
  <circle cx="260" cy="150" r="72" fill="#0f172a" stroke="url(#cyan)" stroke-width="3"/>
  <circle cx="260" cy="132" r="24" fill="#22d3ee" opacity=".9"/>
  <path d="M212 198c10-26 30-38 48-38s38 12 48 38" fill="#22d3ee" opacity=".9"/>

  <!-- Identity -->
  <text x="260" y="262" text-anchor="middle" class="mono title">Muhammad Ali</text>
  <text x="260" y="288" text-anchor="middle" class="mono role">SOFTWARE ENGINEER</text>

  <!-- Typing status -->
  <rect x="45" y="315" width="430" height="54" rx="14" fill="#02060d" stroke="#1e293b"/>
  <text x="65" y="338" class="mono small">$ status --now</text>
  <text x="65" y="358" class="mono text clip1 line1">Building mobile &amp; backend products</text>
  <rect x="318" y="346" width="9" height="15" class="cursor"/>

  <rect x="45" y="381" width="430" height="38" rx="12" fill="#02060d" stroke="#1e293b"/>
  <text x="65" y="405" class="mono text clip2 line2">Flutter • Kotlin • ASP.NET Core</text>

  <!-- Skills -->
  <text x="45" y="458" class="mono label">Mobile Development</text>
  <text x="475" y="458" text-anchor="end" class="mono percent">92%</text>
  <rect x="45" y="468" width="430" height="8" rx="4" fill="#111c2e"/>
  <rect x="45" y="468" width="396" height="8" rx="4" fill="url(#cyan)" class="barFill b1"/>

  <text x="45" y="506" class="mono label">Backend &amp; APIs</text>
  <text x="475" y="506" text-anchor="end" class="mono percent">88%</text>
  <rect x="45" y="516" width="430" height="8" rx="4" fill="#111c2e"/>
  <rect x="45" y="516" width="378" height="8" rx="4" fill="url(#purple)" class="barFill b2"/>

  <text x="45" y="554" class="mono label">Databases</text>
  <text x="475" y="554" text-anchor="end" class="mono percent">84%</text>
  <rect x="45" y="564" width="430" height="8" rx="4" fill="#111c2e"/>
  <rect x="45" y="564" width="361" height="8" rx="4" fill="url(#cyan)" class="barFill b3"/>

  <text x="45" y="602" class="mono label">Problem Solving</text>
  <text x="475" y="602" text-anchor="end" class="mono percent">95%</text>
  <rect x="45" y="612" width="430" height="8" rx="4" fill="#111c2e"/>
  <rect x="45" y="612" width="409" height="8" rx="4" fill="url(#purple)" class="barFill b4"/>

  <!-- Footer chips -->
  <g class="float">
    <rect x="45" y="635" width="94" height="0" fill="none"/>
  </g>
</svg>
