<svg width="1200" height="24" viewBox="0 0 1200 24" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="0.7" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="0" y="11" width="1200" height="2" fill="url(#l)"/>
  <g filter="url(#g)">
    <rect x="592" y="4" width="16" height="16" rx="2" fill="#8B5CF6" transform="rotate(45 600 12)">
      <animate attributeName="fill" values="#22D3EE;#8B5CF6;#F472B6;#22D3EE" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
