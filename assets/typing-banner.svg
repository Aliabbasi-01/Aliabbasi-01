<svg xmlns="http://www.w3.org/2000/svg" width="760" height="70" viewBox="0 0 760 70">
  <defs>
    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#E879F9"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.3 0;0.3 0;-0.3 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    .typing {
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 24px;
      font-weight: 700;
      font-style: italic;
      fill: url(#textGradient);
    }
    .cursor {
      fill: #22D3EE;
      animation: blink 1s steps(1) infinite;
    }
    .line1 { clip-path: inset(0 100% 0 0); animation: type1 2.2s steps(34) .3s forwards; }
    .line2 { clip-path: inset(0 100% 0 0); animation: type2 2.2s steps(30) 2.8s forwards; }
    .line3 { clip-path: inset(0 100% 0 0); animation: type3 2.4s steps(36) 5.3s forwards; }
    .line4 { clip-path: inset(0 100% 0 0); animation: type4 2.2s steps(28) 8s forwards; }

    @keyframes blink { 50% { opacity: 0; } }
    @keyframes type1 { to { clip-path: inset(0 0 0 0); } }
    @keyframes type2 { to { clip-path: inset(0 0 0 0); } }
    @keyframes type3 { to { clip-path: inset(0 0 0 0); } }
    @keyframes type4 { to { clip-path: inset(0 0 0 0); } }
  </style>

  <!-- Line 1 -->
  <text x="20" y="30" class="typing line1">Building high-quality mobile apps 📱</text>

  <!-- Line 2 -->
  <text x="20" y="30" class="typing line2" opacity="0">Crafting robust backend systems ⚙️</text>

  <!-- Line 3 -->
  <text x="20" y="30" class="typing line3" opacity="0">Flutter • Kotlin • ASP.NET Core • C#</text>

  <!-- Line 4 -->
  <text x="20" y="30" class="typing line4" opacity="0">Small steps, big progress 🚀</text>

  <rect x="20" y="42" width="10" height="20" class="cursor"/>
</svg>
