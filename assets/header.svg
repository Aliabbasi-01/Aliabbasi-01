
<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/>
      <stop offset="0.5" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#050914"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#E879F9"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.35 0;0.35 0;-0.35 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>

    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="textGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- Premium ambient orbs -->
  <circle cx="1010" cy="105" r="300" fill="url(#orbViolet)">
    <animate attributeName="r" values="280;330;280" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="360" r="280" fill="url(#orbCyan)">
    <animate attributeName="r" values="250;310;250" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtle grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.035">
    <path d="M0 105H1200M0 210H1200M0 315H1200"/>
    <path d="M200 0V420M400 0V420M600 0V420M800 0V420M1000 0V420"/>
  </g>

  <!-- Glass content panel -->
  <rect x="48" y="48" width="1104" height="324" rx="28" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <rect x="48" y="48" width="1104" height="324" rx="28" fill="none" stroke="url(#accent)" stroke-opacity="0.25"/>

  <!-- Left accent line -->
  <rect x="96" y="118" width="3" height="164" rx="1.5" fill="url(#accent)"/>

  <!-- Eyebrow -->
  <text x="126" y="132" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="15" letter-spacing="4" fill="#22D3EE">SOFTWARE ENGINEER</text>

  <!-- Name -->
  <text x="124" y="212" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="72" font-weight="700" fill="url(#nameGradient)"
        filter="url(#textGlow)">Muhammad Ali</text>

  <!-- Animated underline -->
  <rect x="126" y="234" width="430" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Roles -->
  <text x="126" y="278" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="19" fill="#CBD5E1">Mobile Developer  ·  Backend Engineer  ·  Problem Solver</text>

  <!-- Tagline -->
  <text x="126" y="312" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="16" fill="#7C8AA5">Turning ideas into clean, scalable and production-ready products.</text>

  <!-- Minimal tech chips -->
  <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13"
     font-weight="600" fill="#CBD5E1" text-anchor="middle">
    <rect x="126" y="334" width="82" height="30" rx="15" fill="#0B1220" stroke="#22D3EE" stroke-opacity="0.35"/>
    <text x="167" y="353">Flutter</text>

    <rect x="218" y="334" width="76" height="30" rx="15" fill="#0B1220" stroke="#818CF8" stroke-opacity="0.35"/>
    <text x="256" y="353">Kotlin</text>

    <rect x="304" y="334" width="122" height="30" rx="15" fill="#0B1220" stroke="#A78BFA" stroke-opacity="0.35"/>
    <text x="365" y="353">ASP.NET Core</text>

    <rect x="436" y="334" width="48" height="30" rx="15" fill="#0B1220" stroke="#34D399" stroke-opacity="0.35"/>
    <text x="460" y="353">C#</text>
  </g>

  <!-- Right-side minimal terminal -->
  <g>
    <rect x="730" y="112" width="380" height="216" rx="18" fill="#050914" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <rect x="730" y="112" width="380" height="38" rx="18" fill="#0B1220"/>
    <rect x="730" y="132" width="380" height="18" fill="#0B1220"/>

    <circle cx="754" cy="131" r="5" fill="#F87171"/>
    <circle cx="772" cy="131" r="5" fill="#FBBF24"/>
    <circle cx="790" cy="131" r="5" fill="#34D399"/>

    <text x="754" y="180" font-family="'Courier New',monospace" font-size="14" fill="#22D3EE">$ whoami</text>
    <text x="754" y="206" font-family="'Courier New',monospace" font-size="14" fill="#E2E8F0">Muhammad Ali — Software Engineer</text>

    <text x="754" y="238" font-family="'Courier New',monospace" font-size="14" fill="#22D3EE">$ stack</text>
    <text x="754" y="264" font-family="'Courier New',monospace" font-size="14" fill="#94A3B8">Flutter · Kotlin · ASP.NET Core · C#</text>

    <text x="754" y="296" font-family="'Courier New',monospace" font-size="14" fill="#22D3EE">$ status</text>
    <text x="754" y="318" font-family="'Courier New',monospace" font-size="14" fill="#E2E8F0">Building scalable products</text>
    <rect x="963" y="306" width="9" height="15" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Bottom signature line -->
  <rect x="0" y="414" width="1200" height="6" fill="url(#accent)"/>
</svg>
