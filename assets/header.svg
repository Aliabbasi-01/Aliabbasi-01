<svg width="1200" height="440" viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01030A"/>
      <stop offset="0.45" stop-color="#070B1C"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.45" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#FF2D95"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.4 0;0.4 0;-0.4 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#D8E3FF"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>

    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="1200" height="440" fill="url(#space)"/>

  <!-- Stars -->
  <g fill="#FFFFFF">
    <circle cx="80" cy="55" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="120" r="1"><animate attributeName="opacity" values="1;0.1;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="390" cy="45" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="95" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="35" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="75" r="1.6"><animate attributeName="opacity" values="1;0.1;1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="50" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="130" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="380" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="400" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="390" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- HUD rings -->
  <g transform="translate(960 220)">
    <circle r="175" fill="none" stroke="#22D3EE" stroke-opacity="0.20" stroke-width="1"/>
    <circle r="145" fill="none" stroke="#7C3AED" stroke-opacity="0.25" stroke-width="1.5"
      stroke-dasharray="8 18">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle r="115" fill="none" stroke="#FF2D95" stroke-opacity="0.18" stroke-width="1"
      stroke-dasharray="3 12">
      <animateTransform attributeName="transform" type="rotate"
        from="360" to="0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle r="85" fill="url(#core)">
      <animate attributeName="r" values="80;95;80" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="52" fill="none" stroke="url(#neon)" stroke-width="3" filter="url(#neonGlow)">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbiting dot -->
    <g>
      <circle cx="145" cy="0" r="5" fill="#22D3EE" filter="url(#neonGlow)"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Left HUD frame -->
  <g stroke="#22D3EE" stroke-opacity="0.35" fill="none">
    <path d="M45 45 H145 M45 45 V125"/>
    <path d="M45 395 H145 M45 395 V315"/>
    <path d="M655 45 H755 M755 45 V125"/>
    <path d="M655 395 H755 M755 395 V315"/>
  </g>

  <!-- Top system line -->
  <text x="80" y="82" font-family="'Courier New',monospace" font-size="15"
        fill="#22D3EE" letter-spacing="3">SYSTEM ONLINE</text>
  <rect x="80" y="94" width="230" height="2" fill="url(#neon)"/>

  <!-- Name block -->
  <text x="80" y="180" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="24" fill="#94A3B8">Hi, I’m</text>

  <text x="76" y="262" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="82" font-weight="800" fill="url(#title)"
        filter="url(#neonGlow)">MUHAMMAD ALI</text>

  <rect x="80" y="286" width="500" height="4" rx="2" fill="url(#neon)"/>

  <!-- Roles -->
  <text x="80" y="328" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="20" fill="#E2E8F0">Software Engineer  ·  Mobile Developer  ·  Backend Developer</text>

  <!-- Terminal status -->
  <g font-family="'Courier New',monospace" font-size="15">
    <text x="80" y="368" fill="#22D3EE">&gt; building:</text>
    <text x="180" y="368" fill="#E2E8F0">scalable mobile &amp; backend products</text>
    <rect x="490" y="355" width="10" height="17" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Tech modules -->
  <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13"
     font-weight="700" fill="#E2E8F0" text-anchor="middle">
    <rect x="80" y="390" width="84" height="28" rx="14" fill="#050B18" stroke="#22D3EE" stroke-opacity="0.4"/>
    <text x="122" y="409">Flutter</text>

    <rect x="174" y="390" width="74" height="28" rx="14" fill="#050B18" stroke="#818CF8" stroke-opacity="0.4"/>
    <text x="211" y="409">Kotlin</text>

    <rect x="258" y="390" width="120" height="28" rx="14" fill="#050B18" stroke="#A78BFA" stroke-opacity="0.4"/>
    <text x="318" y="409">ASP.NET Core</text>

    <rect x="388" y="390" width="46" height="28" rx="14" fill="#050B18" stroke="#34D399" stroke-opacity="0.4"/>
    <text x="411" y="409">C#</text>
  </g>

  <!-- Data lines -->
  <g stroke="url(#neon)" stroke-width="2" fill="none" opacity="0.7">
    <path d="M700 90 H820">
      <animate attributeName="stroke-dashoffset" from="120" to="0" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M700 350 H820">
      <animate attributeName="stroke-dashoffset" from="0" to="120" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Bottom energy bar -->
  <rect x="0" y="432" width="1200" height="8" fill="url(#neon)"/>
</svg>
