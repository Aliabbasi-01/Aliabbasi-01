<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04050E"/>
      <stop offset="0.55" stop-color="#14103A"/>
      <stop offset="1" stop-color="#1E1578"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#E879F9"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0;0.6 0;-0.6 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F472B6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowP"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.35"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6366F1" stroke-opacity="0.13"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <circle cx="960" cy="190" r="280" fill="url(#glowP)">
    <animate attributeName="r" values="250;320;250" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="430" r="260" fill="url(#glowC)">
    <animate attributeName="r" values="220;290;220" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- twinkling particles -->
  <g fill="#22D3EE">
    <circle cx="120" cy="40" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="55" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="25" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="70" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1180" cy="200" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="3s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#E879F9">
    <circle cx="240" cy="395" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="388" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="40" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="390" r="2"><animate attributeName="opacity" values="1;0.1;1" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- floating code symbols -->
  <g font-family="'Courier New', monospace" font-size="34" fill="#6366F1" opacity="0.4">
    <text x="715" y="62">{ }<animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="5s" repeatCount="indefinite"/></text>
    <text x="1085" y="400">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="6s" repeatCount="indefinite"/></text>
    <text x="975" y="395">;<animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" repeatCount="indefinite"/></text>
  </g>

  <!-- left content -->
  <text x="60" y="62" font-family="'Courier New', monospace" font-size="19" fill="#22D3EE">&lt;/&gt;  Code  /  Build  /  Innovate</text>
  <rect x="60" y="76" width="260" height="2" rx="1" fill="url(#bar)"/>

  <text x="60" y="150" font-size="38" font-weight="600" fill="#F8FAFC">Hi, I'm</text>
  <text x="58" y="236" font-size="76" font-weight="800" fill="url(#name)" filter="url(#glow)" textLength="650" lengthAdjust="spacingAndGlyphs">Muhammad Ali</text>

  <text x="60" y="284" font-size="20" fill="#E2E8F0" letter-spacing="0.5">Software Engineer   |   Application Developer   |   Backend Developer</text>
  <rect x="60" y="302" width="4" height="40" rx="2" fill="#22D3EE"/>
  <text x="78" y="320" font-size="17" fill="#94A3B8">Turning ideas into scalable applications</text>
  <text x="78" y="341" font-size="17" fill="#94A3B8">with modern technologies.</text>

  <!-- tech chips -->
  <g font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">
    <g stroke-width="1.5" fill="#0B1026" fill-opacity="0.85">
      <rect x="60"  y="366" width="92"  height="34" rx="17" stroke="#38BDF8"/>
      <rect x="164" y="366" width="86"  height="34" rx="17" stroke="#A78BFA"/>
      <rect x="262" y="366" width="136" height="34" rx="17" stroke="#818CF8"/>
      <rect x="410" y="366" width="62"  height="34" rx="17" stroke="#34D399"/>
      <rect x="484" y="366" width="100" height="34" rx="17" stroke="#4ADE80"/>
      <rect x="596" y="366" width="100" height="34" rx="17" stroke="#F472B6"/>
    </g>
    <text x="106" y="388" stroke="none">Flutter</text>
    <text x="207" y="388">Kotlin</text>
    <text x="330" y="388">ASP.NET Core</text>
    <text x="441" y="388">C#</text>
    <text x="534" y="388">Android</text>
    <text x="646" y="388">Backend</text>
  </g>

  <!-- tagline top-right -->
  <text x="1150" y="42" text-anchor="end" font-size="17" font-style="italic" fill="#FBBF24">Better Code, Bigger Dreams</text>

  <!-- laptop -->
  <g>
    <rect x="800" y="80" width="340" height="212" rx="14" fill="#0A0F26" stroke="#6366F1" stroke-width="2" filter="url(#soft)"/>
    <rect x="800" y="80" width="340" height="28" rx="14" fill="#151B3D"/>
    <rect x="800" y="94" width="340" height="14" fill="#151B3D"/>
    <circle cx="820" cy="94" r="4.5" fill="#F87171"/>
    <circle cx="836" cy="94" r="4.5" fill="#FBBF24"/>
    <circle cx="852" cy="94" r="4.5" fill="#34D399"/>

    <g>
      <rect x="822" y="124" height="8" rx="4" fill="#22D3EE" width="120"><animate attributeName="width" values="0;120;120;0" keyTimes="0;0.35;0.9;1" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="842" y="144" height="8" rx="4" fill="#A78BFA" width="180"><animate attributeName="width" values="0;180;180;0" keyTimes="0;0.35;0.9;1" dur="6s" begin="0.4s" repeatCount="indefinite"/></rect>
      <rect x="842" y="164" height="8" rx="4" fill="#F472B6" width="140"><animate attributeName="width" values="0;140;140;0" keyTimes="0;0.35;0.9;1" dur="6s" begin="0.8s" repeatCount="indefinite"/></rect>
      <rect x="862" y="184" height="8" rx="4" fill="#34D399" width="200"><animate attributeName="width" values="0;200;200;0" keyTimes="0;0.35;0.9;1" dur="6s" begin="1.2s" repeatCount="indefinite"/></rect>
      <rect x="842" y="204" height="8" rx="4" fill="#FBBF24" width="100"><animate attributeName="width" values="0;100;100;0" keyTimes="0;0.35;0.9;1" dur="6s" begin="1.6s" repeatCount="indefinite"/></rect>
      <rect x="842" y="224" height="8" rx="4" fill="#22D3EE" width="160"><animate attributeName="width" values="0;160;160;0" keyTimes="0;0.35;0.9;1" dur="6s" begin="2s" repeatCount="indefinite"/></rect>
      <rect x="822" y="244" height="8" rx="4" fill="#A78BFA" width="90"><animate attributeName="width" values="0;90;90;0" keyTimes="0;0.35;0.9;1" dur="6s" begin="2.4s" repeatCount="indefinite"/></rect>
      <rect x="822" y="264" width="8" height="12" fill="#22D3EE"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    </g>
    <path d="M772 292 H1168 L1146 314 H794 Z" fill="#1B1F4B" stroke="#6366F1" stroke-width="1.5"/>
    <rect x="930" y="296" width="80" height="4" rx="2" fill="#6366F1" opacity="0.6"/>
  </g>

  <!-- floating tech badges -->
  <g font-weight="700" font-size="15" fill="#fff" text-anchor="middle">
    <g>
      <circle cx="792" cy="98" r="31" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="2" filter="url(#soft)"/>
      <text x="792" y="104">.NET</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="1152" cy="124" r="27" fill="#1E1B4B" stroke="#E879F9" stroke-width="2" filter="url(#soft)"/>
      <text x="1152" y="130">C#</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="4.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="776" cy="282" r="26" fill="#0C2A4D" stroke="#38BDF8" stroke-width="2" filter="url(#soft)"/>
      <text x="776" y="288" font-size="14">Fl</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="1164" cy="284" r="26" fill="#2A1B5E" stroke="#A78BFA" stroke-width="2" filter="url(#soft)"/>
      <text x="1164" y="290" font-size="14">Kt</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 9;0 0" dur="3.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- animated bottom bar -->
  <rect x="0" y="414" width="1200" height="6" fill="url(#bar)"/>
</svg>
